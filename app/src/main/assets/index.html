<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halo TV</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d15;color:#fff;font-family:Arial,Roboto,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;border:0;cursor:pointer}#wall{position:fixed;inset:0;background:url('wallpaper.jpg') center center/cover no-repeat;background-color:#1b2436}#overlay{position:fixed;inset:0;background:linear-gradient(90deg,rgba(4,8,17,.79) 0%,rgba(5,9,20,.42) 58%,rgba(3,7,16,.28) 100%),linear-gradient(0deg,rgba(3,7,14,.94),transparent 54%,rgba(3,7,14,.38));pointer-events:none}.shell{position:relative;width:100%;height:100%;padding:3.2vh 4.2vw;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;gap:3vw;min-height:7.5vh}.identity{display:flex;align-items:center;gap:.8vw;font-size:1.65vw;font-weight:800;letter-spacing:-.07em;white-space:nowrap}.orb{height:2.6vw;width:2.6vw;border-radius:50%;background:radial-gradient(circle at 28% 22%,#fff,#b9d9ff 21%,#6088d6 55%,#273554 83%);box-shadow:inset -.2vw -.3vw .7vw #152441,0 0 1.4vw #9ccaff55}.glass-nav{display:flex;gap:.4vw;padding:.5vw;border-radius:99px;background:linear-gradient(145deg,rgba(255,255,255,.21),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.27);box-shadow:inset 0 1px 0 #ffffff45,0 .8vw 2.5vw #0005;/* deliberately no backdrop-filter: cheaper on TV GPUs */}.nav-item{padding:.67vw 1.55vw;border-radius:99px;background:transparent;font-size:1.12vw;color:#e1e7f2;outline:none}.nav-item.active{background:rgba(255,255,255,.19);color:#fff}.nav-item.focus{background:linear-gradient(145deg,#ffffffec,#cad8f2d9);color:#152139;box-shadow:inset 0 1px 0 #fff,0 0 0 2px #fff7}.right{display:flex;gap:1.3vw;align-items:center;font-size:1.13vw;color:#e6edf8}.clock{font-weight:700}.circle{width:2.7vw;height:2.7vw;border-radius:50%;display:grid;place-items:center;background:#ffffff16;border:1px solid #ffffff32;font-size:1.4vw}.hero{margin-top:9vh;max-width:54vw}.kicker{font-size:1.1vw;letter-spacing:.28em;color:#bdd5ff;font-weight:700;margin-bottom:1.4vh}.hero h1{font-size:5.1vw;line-height:1.03;letter-spacing:-.055em;margin:0;font-weight:800;text-shadow:0 .3vw 1.5vw #0006}.hero p{font-size:1.45vw;color:#e3e9f4;line-height:1.55;margin:2.2vh 0 0;max-width:39vw;text-shadow:0 2px 12px #0009}.meta{display:flex;gap:1vw;margin-top:3.2vh;align-items:center;color:#d8e0ef;font-size:1.12vw}.dot{height:.35vw;width:.35vw;border-radius:50%;background:#bed6ff}.spacer{flex:1;min-height:3vh}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:1.6vh}.section-head h2{font-size:1.65vw;margin:0;letter-spacing:-.03em}.section-head span{font-size:1.04vw;color:#d4ddec}.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.35vw;padding:.5vw .35vw 1.2vw}.tile{min-width:0;position:relative;height:15.3vh;min-height:76px;border-radius:1.25vw;background:linear-gradient(145deg,rgba(18,27,46,.83),rgba(15,22,38,.78));border:1px solid #ffffff24;box-shadow:0 .7vw 1.6vw #0004;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.65vh;outline:none;overflow:visible;transition:transform .12s ease}.tile .ico{height:6.2vh;width:6.2vh;min-width:35px;min-height:35px;max-width:74px;max-height:74px;border-radius:1vw;display:grid;place-items:center;font-weight:800;font-size:2.5vw;background:linear-gradient(135deg,#506d96,#283c60);overflow:hidden}.tile img{height:100%;width:100%;object-fit:contain}.tile .name{font-size:1.12vw;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;text-align:center;font-weight:600;text-shadow:0 2px 6px #0006}.tile.focus{z-index:2;transform:scale(1.07);background:linear-gradient(155deg,rgba(241,247,255,.33),rgba(187,216,255,.17) 50%,rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.94);box-shadow:inset 0 1px 0 #fff9,inset 0 -1px 0 #fff4,0 0 0 .2vw #d8eaff44,0 1vw 2.8vw #0009,0 0 2.3vw #a8cfff55}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:2.4vh;font-size:1vw;color:#c4d0e3}.tiny{letter-spacing:.12em;font-weight:700;color:#c4d7f4}.hint{opacity:.85}.toast{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);background:#eef4ff;color:#18243a;border-radius:1vw;padding:1vw 1.5vw;display:none;font-size:1.1vw}.toast.show{display:block}@media(max-width:800px){.hero{margin-top:6vh}.tile{height:16vh}.shell{padding:3vh 4vw}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="wall"></div><div id="overlay"></div><main class="shell"><header class="header"><div class="identity"><span class="orb"></span><span>halo<span style="font-weight:400">TV</span></span></div><nav class="glass-nav" id="nav"><button class="nav-item active" data-tab="Home">Home</button><button class="nav-item" data-tab="Apps">Apps</button><button class="nav-item" data-tab="Discover">Discover</button></nav><div class="right"><span id="clock" class="clock"></span><span class="circle">⚙</span></div></header><section class="hero"><div class="kicker">WELCOME HOME</div><h1>Your world.<br>One beautiful screen.</h1><p>Everything you love, right where you need it. Simple, fast, and made for your TV.</p><div class="meta"><span>YOUR ENTERTAINMENT</span><span class="dot"></span><span id="date"></span></div></section><div class="spacer"></div><section><div class="section-head"><h2 id="heading">Your apps</h2><span id="count">Use ◀ ▶ to browse · OK to open</span></div><div class="dock" id="dock"></div></section><footer class="footer"><span class="tiny">HALO TV <span style="opacity:.5">/</span> HOME</span><span class="hint">↑ Navigation &nbsp; • &nbsp; ← → Apps &nbsp; • &nbsp; OK Select</span></footer><div class="toast" id="toast"></div></main><script>
(function(){'use strict';var native=typeof Android!=='undefined',apps=[],icons={},index=0,offset=0,zone='apps',navIndex=0;var dock=document.getElementById('dock'),nav=document.getElementById('nav').children,toast=document.getElementById('toast'),timer;
function clock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});}clock();setInterval(clock,60000);
function msg(s){toast.textContent=s;toast.className='toast show';clearTimeout(timer);timer=setTimeout(function(){toast.className='toast'},1800)}
function getApps(){try{var a=native?JSON.parse(Android.getApps()):[{p:'yt',n:'YouTube'},{p:'net',n:'Netflix'},{p:'prime',n:'Prime Video'},{p:'music',n:'Music'},{p:'browser',n:'Browser'},{p:'files',n:'Files'},{p:'photos',n:'Photos'}];apps=Array.isArray(a)?a:[]}catch(e){apps=[]}apps.push({p:'__settings',n:'Settings'});if(index>=apps.length)index=0;render();if(native)loadIcons(0)}
function loadIcons(i){if(i>=apps.length-1)return;setTimeout(function(){var a=apps[i];try{if(!icons[a.p])icons[a.p]=Android.getIcon(a.p)||''}catch(e){}if(i>=offset&&i<offset+5)render();loadIcons(i+1)},25)}
function tile(a,i){var el=document.createElement('button');el.className='tile'+(zone==='apps'&&i===index?' focus':'');el.setAttribute('aria-label',a.n);var ico=document.createElement('span');ico.className='ico';if(icons[a.p]){var img=document.createElement('img');img.src=icons[a.p];ico.appendChild(img)}else{ico.textContent=a.p==='__settings'?'⚙':a.n.slice(0,1).toUpperCase()}var label=document.createElement('span');label.className='name';label.textContent=a.n;el.appendChild(ico);el.appendChild(label);el.onclick=function(){index=i;zone='apps';render();launch(a)};return el}
function render(){if(index<offset)offset=index;if(index>=offset+5)offset=index-4;offset=Math.max(0,Math.min(offset,Math.max(0,apps.length-5)));dock.textContent='';for(var i=offset;i<Math.min(offset+5,apps.length);i++)dock.appendChild(tile(apps[i],i));for(var j=0;j<nav.length;j++){nav[j].className='nav-item'+(j===navIndex?' active':'')+(zone==='nav'&&j===navIndex?' focus':'')}document.getElementById('count').textContent=apps.length+' apps · ◀ ▶ Browse · OK Open'}
function launch(a){if(!a)return;if(native){try{if(a.p==='__settings')Android.openSettings();else Android.launch(a.p)}catch(e){msg('Unable to open '+a.n)}}else msg(a.n+' — install Android version to launch apps')}
function selectTab(i){navIndex=i;render();if(i===1){zone='apps';render()}else if(i===2)msg('Browse all apps using the dock below')}
for(var j=0;j<nav.length;j++){(function(i){nav[i].onclick=function(){zone='nav';selectTab(i)}})(j)}
document.addEventListener('keydown',function(e){var k=e.keyCode,used=true;if(k===13||k===23||k===66||k===32){if(zone==='apps')launch(apps[index]);else selectTab(navIndex)}else if(k===37||k===21){if(zone==='apps')index=Math.max(0,index-1);else navIndex=Math.max(0,navIndex-1)}else if(k===39||k===22){if(zone==='apps')index=Math.min(apps.length-1,index+1);else navIndex=Math.min(nav.length-1,navIndex+1)}else if(k===38||k===19){zone='nav'}else if(k===40||k===20){zone='apps'}else if(k===4||k===27||k===8){zone='apps';index=0;offset=0}else used=false;if(used){e.preventDefault();render()}});
window.refreshApps=getApps;window.goHome=function(){zone='apps';index=0;offset=0;render()};getApps();})();
</script></body></html>
